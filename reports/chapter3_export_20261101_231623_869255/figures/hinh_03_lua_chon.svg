   <g id="text_1">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(189.213516 82.314084)">Benchmark: 22 cấu hình; first 5-fold mean AP/Brier</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(201.345273 92.856409)">Repeated 15 fold còn dùng SD hiệu ghép cặp</text>
   </g>
   <g id="text_2">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(180.029531 158.312644)">Mỗi thuật toán: mốc AP cao nhất; duyệt P0→P1→P2→P3</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(176.357266 168.941296)">Giảm AP≤max(0,005; SD hiệu 15 fold), tăng Brier≤0,005</text>
   </g>
   <g id="text_3">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(184.849297 233.95593)">Xếp 5 đại diện theo mean AP → shortlist 2 thuật toán</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(179.699492 244.892707)">Giữ scenario; không lấy trực tiếp top 2 toàn benchmark</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(187.081211 309.875466)">RandomizedSearchCV: 10 trial × inner3 / thuật toán</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(197.861602 320.41779)">Đánh giá lại tuned và untuned trên cùng 5 fold</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(172.02293 386.016799)">Giữ mốc mean AP cao nhất; đổi sang Brier thấp hơn chỉ khi</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(212.391953 396.645451)">AP giảm≤0,005 và ECE OOF không tăng</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(215.991836 462.92812)">Sigmoid: outer5, inner3 chỉ outer-train</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(167.240352 473.864898)">Nhận nếu mean AP giảm≤0,005 và Brier/ECE OOF cùng giảm</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(166.213047 484.937144)">Không đạt: giữ raw; thiếu cal_scores lưu nên chưa tái kiểm AP</text>
   </g>
   <g id="text_7">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(217.918945 558.339402)">OOF của phiên bản giữ lại → tối đa F1</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(202.093672 569.276179)">Hòa: recall cao hơn, sau đó ngưỡng thấp hơn</text>
   </g>
   <g id="text_8">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(188.635781 648.259716)">Cố định mô hình/calibration/ngưỡng → fit toàn train</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(194.880625 658.802041)">Lưu artifact → robustness → finalize trên holdout</text>
   </g>
  </g>
  <g id="text_9">
   <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle" x="297.72" y="35.648369" transform="rotate(-0 297.72 35.648369)">Benchmark, lựa chọn, calibration và ngưỡng</text>
  </g>
  <g id="text_10">
   <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(35.7264 798.975106)">Nguồn: src/thesis.py:tune; src/evaluation.py:choose_threshold. AP mean fold không phải AP OOF gộp; Brier/ECE</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(35.7264 809.498544)">dùng OOF gộp. SD không là CI hoặc kiểm định tương đương. CV chọn trên train vẫn có thiên lệch lựa chọn.</text>
  </g>
 </g>
