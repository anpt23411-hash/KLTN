   <g id="text_1">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(217.153945 82.116858)">Người dùng → giao diện nhận yêu cầu</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(236.441641 93.057619)">Đề xuất — chưa có giao diện</text>
   </g>
   <g id="text_2">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(249.412773 164.872428)">Agent điều phối + LLM</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(221.926562 175.944674)">Đề xuất — chưa triển khai/kiểm thử</text>
   </g>
   <g id="text_3">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(118.529979 262.930679)">Truy xuất hồ sơ / CRM</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(113.354276 274.002925)">Phân quyền, kiểm tra ID</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(115.889667 284.939702)">Chưa có kết nối dữ liệu</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(376.950685 262.439273)">Tool adapter / API service</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(372.577169 273.620425)">Đóng gói suy luận/diễn giải</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(398.119669 284.692671)">Chưa triển khai</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(209.55707 380.755597)">Lõi suy luận cục bộ ĐÃ CÓ: predict_frame</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(188.759961 391.827844)">Kiểm tra schema → pipeline.joblib + metadata.json</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(195.960391 402.46048)">Chỉ đặc trưng; không đưa ID/Churn vào mô hình</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(248.862266 482.69678)">Đầu ra xác định ĐÃ CÓ</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(181.517695 493.769026)">Xác suất → nhãn theo t*; điểm 1–10; ba nhóm nguy cơ</text>
   </g>
   <g id="text_7">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(175.129414 580.235734)">Đề xuất: Agent nhận kết quả có nguồn, trình bày báo cáo</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(197.339648 591.416887)">Không tự tạo xác suất/điểm; xử lý lỗi và ghi log</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(174.991953 602.598039)">SHAP đã lưu chỉ cho mẫu train, chưa có dịch vụ hồ sơ mới</text>
   </g>
   <g id="text_8">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(183.135352 682.57137)">Đề xuất: kiểm thử tool/tra cứu/khớp kết quả/giải thích</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(191.986641 693.643616)">Latency và chi phí API — chưa có số liệu kiểm thử</text>
   </g>
