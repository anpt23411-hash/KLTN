  <g id="text_10">
   <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle" x="297.72" y="38.955244" transform="rotate(-0 297.72 38.955244)">AI Agent đánh giá nguy cơ — KIẾN TRÚC ĐỀ XUẤT</text>
  </g>
  <g id="text_11">
   <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(35.7264 799.077606)">Nguồn: src/predict.py; metadata/pipeline ML; bản trích §3.10–3.11 chỉ có đề mục. Xanh liền: thành phần ML cục</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(35.7264 809.498544)">bộ đã có, chưa tích hợp Agent. Cam đứt: đề xuất, chưa triển khai. Không ngụ ý hệ thống Agent đang hoạt động.</text>
  </g>
