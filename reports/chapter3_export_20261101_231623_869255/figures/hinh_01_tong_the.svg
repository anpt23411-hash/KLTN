   <g id="text_1">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(217.308672 89.018634)">Đọc dữ liệu thật → chuẩn hóa tất định</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(220.567891 100.09088)">Kiểm tra nhãn/xung đột → loại trùng</text>
   </g>
   <g id="text_2">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(181.349023 171.841938)">Chia phân tầng sau làm sạch: train 80% / holdout 20%</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(188.765273 182.778715)">Giữ holdout riêng; công bố đã từng quan sát ở pilot</text>
   </g>
   <g id="text_3">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(207.484531 254.378367)">Chỉ train: EDA → nghiên cứu đặc trưng A–F</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(204.038047 265.576785)">Repeated 5×3; chọn đặc trưng theo quy tắc</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(180.035508 337.283351)">Smoke → benchmark 5 thuật toán × P0–P3 + 2 dummy</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(200.785469 348.224113)">Repeated 5×3; 5 fold đầu dùng chọn đại diện</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(173.028984 420.106655)">Shortlist → tuning và untuned → calibration → ngưỡng OOF</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(211.982891 431.043433)">Fit toàn train, lưu mô hình và quyết định</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(194.524023 503.247381)">Robustness trên train → diễn giải và đo thời gian</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(190.357031 514.184159)">Sau đó đánh giá holdout với quyết định đã cố định</text>
   </g>
   <g id="text_7">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(239.189531 585.946506)">Xuất artifact ML và báo cáo</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(205.531523 596.883283)">Hình kết quả thực nghiệm đặt tại Chương 4</text>
   </g>
   <g id="text_8">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(213.145 668.767818)">Tích hợp AI Agent và kiểm thử hệ thống</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(221.196758 679.840064)">Giai đoạn đề xuất — chưa triển khai</text>
   </g>
  </g>
  <g id="text_9">
   <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle" x="297.72" y="37.100712" transform="rotate(-0 297.72 37.100712)">Quy trình nghiên cứu tổng thể</text>
  </g>
  <g id="text_10">
   <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(35.7264 799.201356)">Nguồn: src/thesis.py:prepare→features→smoke→benchmark→tune→robustness→finalize; src/data.py. Nét xanh liền: đã</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(35.7264 809.498544)">có mã/artifact ML; nét cam đứt: kiến trúc/giai đoạn đề xuất.</text>
  </g>
 </g>
