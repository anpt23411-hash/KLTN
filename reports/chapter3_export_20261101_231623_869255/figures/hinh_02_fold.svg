   <g id="text_1">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(227.126172 82.381819)">Train phát triển → chia chỉ số fold</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(236.254375 92.924143)">Validation không tham gia fit</text>
   </g>
   <g id="text_2">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(106.367011 159.177917)">HUẤN LUYỆN: fit / resample</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(108.893769 169.380241)">X_train_fold + y_train_fold</text>
   </g>
   <g id="text_3">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(362.7092 157.866394)">VALIDATION: transform / predict</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(379.155372 168.408718)">X_validation; giữ y riêng</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(113.522284 242.490312)">prepare.fit rồi transform</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(104.728104 253.427089)">Học cờ thiếu, median/mode,</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(112.354198 263.969413)">danh mục và log từ train</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(391.899395 242.31832)">prepare.transform</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(371.07506 252.860644)">Dùng trạng thái học từ train</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(375.245372 263.402968)">Không học cờ/median mới</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(102.502831 352.934665)">Chỉ P2/P3: scale khoảng cách</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(107.99994 363.13699)">SMOTE-NC → inverse scale</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(116.023144 374.073767)">Tính lại biến phụ thuộc</text>
   </g>
   <g id="text_7">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(373.803028 357.990671)">Không resample validation</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(379.675997 368.927449)">Giữ nguyên phân bố lớp</text>
   </g>
   <g id="text_8">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(118.601698 463.347144)">finish.fit rồi transform</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(111.747245 474.283921)">One-hot; scale số nếu LR</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(129.894081 484.826245)">Sau đó model.fit</text>
   </g>
   <g id="text_9">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(396.97881 463.345152)">finish.transform</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(375.235411 473.887476)">Dùng encoder/scaler train</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(386.809356 484.0898)">model.predict_proba</text>
   </g>
   <g id="text_10">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(182.692422 613.431422)">Xác suất validation + y_validation → metric fold / OOF</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(180.574062 624.612575)">Không dùng validation để học tiền xử lý hoặc sinh mẫu</text>
   </g>
