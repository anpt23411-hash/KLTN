  <g id="text_14">
   <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(35.7264 799.201356)">Nguồn: src/thesis.py:run_cv; PrepareFrame→[LogicalSMOTENC nếu P2/P3]→FinishFrame→model. P0/P1 bỏ qua resample.</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(35.7264 809.498544)">Sigmoid thêm inner3 chỉ trong outer-train. Holdout dùng cùng hợp đồng transform; từng được quan sát ở pilot.</text>
